             C 100 245, 140 220, 180 235
             C 215 248, 245 220, 275 180
             C 290 160, 305 130, 340 130
             C 385 130, 415 165, 415 205
             C 415 210, 414 216, 412 222
             L 470 236
             C 478 238, 480 248, 474 254
             L 412 282
             C 395 330, 345 365, 290 370
             C 210 375, 135 340, 120 280 Z" />
  </g>
  <!-- Beak separation & subtle duck smile -->
  <path d="M 412 248 L 460 245" stroke="#0A0A0A" stroke-width="4" stroke-linecap="round" />
